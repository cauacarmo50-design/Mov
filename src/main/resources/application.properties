# Application Properties
spring.application.name=plataforma-mov
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Import env vars
spring.config.import=optional:file:.env[.properties]

# Database Config
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/mov_db;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Multipart / Upload Config (Seção 3.2)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${APP_UPLOAD_DIR:./uploads}

# Mail Config
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USUARIO:}
spring.mail.password=${EMAIL_SENHA:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
app.mail.enabled=${APP_MAIL_ENABLED:false}

# Thymeleaf Config
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Session Security Config
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_SECURE_COOKIE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=4h

# App Security
app.security.use-reverse-proxy=${APP_USE_REVERSE_PROXY:false}

# Captcha Config
app.captcha.enabled=${APP_CAPTCHA_ENABLED:false}
app.captcha.secret=${CAPTCHA_SECRET_KEY:}
app.captcha.verify-url=${CAPTCHA_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
